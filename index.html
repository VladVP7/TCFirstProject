<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="weather-container">
    <!-- App Header Image -->
    <img src="https://flaticon.com" alt="Weather Logo" class="app-logo">
    <h1>Weather App</h1>
    
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name">
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="weatherResult">
      <!-- Main Weather Condition Image -->
      <img id="weatherIcon" src="https://flaticon.com" alt="Weather Condition" class="weather-icon">
      <h2 id="cityName"></h2>
      
      <div class="weather-details">
        <div class="detail-item">
          <img src="https://flaticon.com" alt="Temperature Icon" class="detail-icon">
          <p id="temperature"></p>
        </div>
        <div class="detail-item">
          <img src="https://flaticon.com" alt="Wind Icon" class="detail-icon">
          <p id="windSpeed"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
